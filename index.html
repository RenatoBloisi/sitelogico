<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mestre da Lógica</title>

    <!-- Fonte do site -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Cabeçalho e menu -->
    <header class="top">
        <div class="wrap">

            <a class="logo" href="#inicio">
                Mestre da Lógica
            </a>

            <!-- Botão do menu hambúrguer -->
            <button class="iconbtn menu-btn"
                    id="menuBtn"
                    aria-label="Abrir menu"
                    aria-expanded="false"
                    aria-controls="nav">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="2"
                     stroke-linecap="round">

                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>

            </button>

            <!-- Opções do menu -->
            <nav class="nav" id="nav">
                <a href="#inicio">Início</a>
                <a href="#fases">Fases</a>
                <a href="#aprender">Aprender</a>
                <a href="#progresso">Meu progresso</a>
            </nav>

            <!-- Pontuação e tema -->
            <div class="hud">
                <div class="xp" id="xp"></div>

                <button class="iconbtn"
                        id="themeBtn"
                        data-act="theme"
                        aria-label="Alternar tema claro e escuro">
                </button>
            </div>

        </div>
    </header>

    <!-- Conteúdo principal -->
    <main class="wrap" id="main"></main>

    <!-- Assistente Severino -->
    <div class="severino" id="severino">

        <div class="panelbot" id="pbot" hidden role="dialog" aria-label="Conversa com a Severino">

            <div class="pb-head">
                <div id="pbMascot"></div>

                <b>
                    Severino
                    <small>Assistente de lógica</small>
                </b>

                <button class="iconbtn"
                        data-act="bot"
                        aria-label="Fechar conversa">
                    ✕
                </button>
            </div>

            <div class="pb-log" id="pbLog" aria-live="polite"></div>

            <div class="pb-chips" id="pbChips"></div>

            <form class="pb-form" id="pbForm" autocomplete="off">
                <input
                    id="pbInput"
                    type="text"
                    placeholder="Pergunte sobre lógica..."
                    aria-label="Sua dúvida">

                <button class="btn" type="submit">
                    Enviar
                </button>
            </form>

        </div>

        <div class="bubble" id="bubble" hidden></div>

        <button class="severino-btn"
                id="severinoBtn"
                data-act="bot"
                aria-label="Abrir a severino, assistente de lógica">

            <span id="severinoMascot"></span>
            <span class="dot" id="severinoDot" hidden></span>

        </button>

    </div>

    <!-- Mensagens do sistema -->
    <div class="toast" id="toast" hidden></div>

    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>
</html>
